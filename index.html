<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekomendasi Menu Kantin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #5a189a;
            margin-bottom: 10px;
        }

        .deskripsi {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #7b2cbf;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7b2cbf;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5a189a;
        }

        #hasil {
            margin-top: 20px;
        }

        .judul-hasil {
            color: white;
            text-align: center;
            margin-bottom: 12px;
        }

        .menu {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .menu h3 {
            color: #5a189a;
            margin-bottom: 8px;
        }

        .harga {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        .keterangan {
            color: #555;
            margin-top: 6px;
            font-size: 14px;
        }

        .pesan {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: #555;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🍽️ Rekomendasi Menu Kantin</h1>

        <p class="deskripsi">
            Pilih jenis menu dan masukkan budget kamu
        </p>

        <label for="pilihan">
            Pilih Jenis Menu
        </label>

        <select id="pilihan">
            <option value="makanan">
                1. Makanan
            </option>

            <option value="minuman">
                2. Minuman
            </option>
        </select>


        <label for="budget">
            Masukkan Budget (Rp)
        </label>

        <input
            type="number"
            id="budget"
            placeholder="Contoh: 12000"
            min="1"
        >


        <button onclick="cariMenu()">
            🔎 Cari Rekomendasi
        </button>

    </div>


    <div id="hasil"></div>

</div>


<script>

    // =========================
    // DAFTAR MENU MAKANAN
    // =========================

    const menuMakanan = [
        {
            nama: "Nasi Goreng",
            harga: 12000
        },

        {
            nama: "Mie Goreng",
            harga: 10000
        },

        {
            nama: "Nasi Kuning",
            harga: 10000
        },

        {
            nama: "Ayam Geprek",
            harga: 15000
        },

        {
            nama: "Bakso",
            harga: 13000
        }
    ];


    // =========================
    // DAFTAR MENU MINUMAN
    // =========================

    const menuMinuman = [
        {
            nama: "Es Teh",
            harga: 5000
        },

        {
            nama: "Air Mineral",
            harga: 4000
        },

        {
            nama: "Es Jeruk",
            harga: 7000
        },

        {
            nama: "Jus Alpukat",
            harga: 10000
        },

        {
            nama: "Cokelat",
            harga: 8000
        }
    ];


    // =========================
    // FORMAT RUPIAH
    // =========================

    function rupiah(angka) {
        return "Rp " + angka.toLocaleString("id-ID");
    }


    // =========================
    // PROGRAM REKOMENDASI
    // =========================

    function cariMenu() {

        let pilihan =
            document.getElementById("pilihan").value;

        let budget =
            Number(document.getElementById("budget").value);

        let hasil =
            document.getElementById("hasil");


        // Mengecek budget

        if (budget <= 0 || isNaN(budget)) {

            hasil.innerHTML = `
                <div class="error">
                    ⚠️ Masukkan budget yang benar!
                </div>
            `;

            return;
        }


        // Menentukan jenis menu

        let daftarMenu;
        let jenisMenu;


        if (pilihan === "makanan") {

            daftarMenu = menuMakanan;
            jenisMenu = "Makanan";

        } else {

            daftarMenu = menuMinuman;
            jenisMenu = "Minuman";

        }


        // Mencari menu yang harganya
        // tidak melebihi budget

        let menuSesuai = daftarMenu.filter(function(menu) {

            return menu.harga <= budget;

        });


        // Jika tidak ada menu

        if (menuSesuai.length === 0) {

            hasil.innerHTML = `

                <div class="pesan">

                    <h3>
                        😔 Tidak Ada Rekomendasi
                    </h3>

                    <p>
                        Tidak ada ${jenisMenu.toLowerCase()}
                        yang sesuai dengan budget
                        ${rupiah(budget)}.
                    </p>

                </div>

            `;

            return;
        }


        // Menampilkan judul hasil

        hasil.innerHTML = `

            <h2 class="judul-hasil">
                Rekomendasi ${jenisMenu}
            </h2>

        `;


        // Menampilkan menu

        menuSesuai.forEach(function(menu) {

            hasil.innerHTML += `

                <div class="menu">

                    <h3>
                        ${menu.nama}
                    </h3>

                    <p class="harga">
                        ${rupiah(menu.harga)}
                    </p>

                    <p class="keterangan">
                        ✓ Sesuai dengan budget kamu
                    </p>

                </div>

            `;

        });

    }

</script>

</body>
</html>
