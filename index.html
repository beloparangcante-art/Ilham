<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ajakan Makan Bersama 💖</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ff9ad5, #b388ff);
      overflow:hidden;
    }

    .container{
      background:white;
      width:350px;
      padding:30px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      position:relative;
    }

    h1{
      color:#c2185b;
      margin-bottom:15px;
    }

    p{
      color:#6a1b9a;
      margin-bottom:20px;
      font-size:18px;
    }

    .stickers{
      font-size:50px;
      margin-bottom:15px;
    }

    .buttons{
      position:relative;
      height:120px;
    }

    button{
      padding:12px 25px;
      border:none;
      border-radius:15px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      color:white;
      font-weight:bold;
    }

    #yesBtn{
      background:#ff4fa3;
      margin-right:10px;
    }

    #yesBtn:hover{
      transform:scale(1.1);
      background:#ff1f8f;
    }

    #noBtn{
      background:#8e44ad;
      position:absolute;
    }

    #message{
      margin-top:20px;
      font-size:20px;
      color:#d81b60;
      font-weight:bold;
      display:none;
      animation: muncul 0.5s ease;
    }

    @keyframes muncul{
      from{
        transform:scale(0.5);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .heart{
      position:absolute;
      color:pink;
      animation: jatuh linear infinite;
    }

    @keyframes jatuh{
      0%{
        transform:translateY(-100px);
        opacity:1;
      }
      100%{
        transform:translateY(100vh);
        opacity:0;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="stickers">🍔💖🍕✨</div>

    <h1>Ajakan Makan Bersama</h1>

    <p>Mau makan bareng aku nggak? 😋</p>

    <div class="buttons">
      <button id="yesBtn">Iya 💕</button>
      <button id="noBtn">Tidak 😜</button>
    </div>

    <div id="message">
      Yeayyy! 🎉<br>
      Aku senang banget kamu mau makan bareng! 💖🍜
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    // Tombol tidak kabur
    noBtn.addEventListener("mouseover", () => {
      const maxX = 250;
      const maxY = 80;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    // Jika menekan iya
    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
      buatHati();
    });

    // Efek hati jatuh
    function buatHati(){
      for(let i = 0; i < 25; i++){
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";

        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = (20 + Math.random() * 30) + "px";
        heart.style.animationDuration = (3 + Math.random() * 5) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }
    }
  </script>

</body>
</html>
